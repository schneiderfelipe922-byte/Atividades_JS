<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Painel de Controle Interativo</h1>

    <h2>1. Caixa de mudança de estado</h2>
    <div id="caixa">Clique aqui para mudar a cor!</div>

    <h2>2. Console de teclado</h2>
    <label for="texto">Digite um texto e pressione Enter:</label>
    <input type="text" id="texto">
    <p id="tecla">Nenhuma tecla pressionada.</p>

    <h2>3. Contador dinâmico</h2>
    <p>Contador: <span id="contador">0</span></p>
    <button id="incrementar">Incrementar (+)</button>
    <button id="decrementar">Decrementar (-)</button>
    <p>Use também as setas para cima e para baixo.</p>

    <script src="script.js"></script>
</body>
</html>
